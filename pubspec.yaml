name: magnifier_mvp
description: 広告に邪魔されない高画質ルーペ＆手鏡アプリ
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  shaders:
    - shaders/sharpen.frag

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
